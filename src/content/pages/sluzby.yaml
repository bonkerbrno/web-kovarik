heroEyebrow: Co nabízím
heroTitle: Služby
heroText: >-
  Rozbor postupů, automatizace rutiny a rozumné  minimalizované využití AI . Na
  základě rozboru a po optimalizaci navrhuji automatizace od úrovně pracoviště
  až po firmu.
auditIcon: 🔍
auditTitle: Procesní audit
auditText: >-
  Společně projdeme, jak u vás práce skutečně probíhá: od poptávky po fakturu,
  od žádosti po vyřízení. Hledám místa, kde se ztrácí čas, peníze a energie a
  kde vznikají chyby.
auditBullets:
  - Rozhovory s lidmi, kteří práci dělají, a rozbor současných postupů
  - Písemná zpráva s plánem zlepšení seřazeným podle přínosu
  - Kde se práce zasekává a co jde zlepšit hned
  - Přehledné schéma, jak u vás práce probíhá
  - Představení výsledků vám i vašemu týmu
auditCta: Mám zájem o audit
auditResultsLabel: Typický výsledek
auditResults:
  - label: Nalezené úspory
    value: 15–40 % času u zmapovaných činností
  - label: Rychlá zlepšení
    value: 3–7 konkrétních kroků
  - label: Délka auditu
    value: 2–4 týdny
  - label: Výstup
    value: Písemná zpráva + prezentace
n8nIcon: ⚙️
n8nTitle: Automatizace
n8nText: >-
  Opakující se práci, jako je přepisování údajů, rozesílání e-mailů nebo
  vystavování faktur, nechám dělat počítač. Používám nástroj n8n, který může
  běžet i na vašem vlastním serveru, takže data zůstávají u vás.
n8nBullets:
  - Výběr činností, které se automatizovat vyplatí
  - Návrh nastavení automatizace na míru
  - Propojení s tím, co už používáte (e-mail, tabulky, účetnictví, evidence…)
  - Vypracování, srozumitelné dokumentace řešení, kódů a předání
  - 'Volitelně: Doporučení správce pro průběžnou správu a úpravy'
n8nCta: Chci automatizovat
n8nCodeComment: // n8n workflow — ukázka
n8nCodeSteps:
  - Najdi zákazníka v evidenci
  - Vystav fakturu (Fakturoid)
  - Pošli potvrzení (e-mail + SMS)
  - Upozorni kolegu (Slack)
  - Založ úkol (Notion / Asana)
n8nCodeFooter: '// Čas: 0.3 s | Manuálně: ~12 min'
aiIcon: 🧠
aiTitle: AI Implementace
aiText: >-
  Ne každý problém potřebuje AI. Tam, kde dává smysl, třeba při zpracování
  dokumentů, psaní textů nebo odpovídání na dotazy zákazníků či občanů, vám
  pomůžu AI skutečně nasadit, ne jen vyzkoušet.
aiBullets:
  - Kde vám AI opravdu ušetří čas (a kde ne)
  - >-
    Výběr vhodného nástroje: Gemini, ChatGPT, Claude, Mistral nebo model běžící
    přímo u vás
  - Zapojení AI do automatizací a nástrojů, které už používáte
  - Asistent, který zná vaše dokumenty a postupy
  - Zaškolení lidí a jasná pravidla, jak AI bezpečně používat
aiCta: Probrat využití AI
aiUseCases:
  - icon: 📧
    label: Podpora
    desc: Třídění e-mailů a návrhy odpovědí
  - icon: 📊
    label: Dokumenty
    desc: Shrnutí, výtahy a zpracování podkladů
  - icon: 💬
    label: Chatbot
    desc: Odpovědi na časté dotazy zákazníků či občanů
  - icon: ✍️
    label: Texty
    desc: Návrhy a korektury textů, překlady
ctaTitle: Nejste si jistí, kde začít?
ctaText: >-
  Úvodní konzultace je zdarma. Společně projdeme vaši situaci a navrhnu, co dává
  největší smysl.
ctaButton: Domluvit bezplatnou konzultaci →
