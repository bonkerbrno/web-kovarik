ctaTitle: Be agile. Just free yourself ...
ctaText: >-
  Rádi vás provedeme džunglí rychle se vyvíjejících nástrojů a vysvětlíme, jak
  to může fungovat ve vašich podmínkách. Bezpečně, předvídatelně, zákonně a
  překvapivě levně.
