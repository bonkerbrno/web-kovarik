subtitle: Praktik v procesech, automatizaci a rozumném využití AI
locationText: 📍 Česká republika  ·  ✉ info@kovarik.us
storyTitle: Proč dělám to, co dělám
storyParagraphs:
  - >-
    Jsem absolvent VUT v Brně. Přes 15 let jsem pracoval v manažerských rolích —
    od středního managementu po ředitelské pozice. Od roku 2015 se věnuji
    optimalizaci procesů a automatizaci.   Často narážím na stejný problém:
    chytří lidé trávií hodiny prací, která je nudí, vyčerpává přitom se dá
    automatizovat. Od r. 2023 se věnuji bezpečné a smysluplné minimalizované
    implementaci Ai.
  - >-
    Fascinovalo mě, jak organizace fungují, co je zpomaluje a proč se výsledky
    ztrácejí v chaosu každodenního provozu. Postupně jsem se stal tím, za kým
    kolegové chodili s otázkou „Jak tohle zefektivnit?“
  - >-
    Před několika lety jsem se začal soustředit na oblast, kde vidím největší
    dopad: kombinaci zlepšování postupů, automatizace a rozumného nasazení AI.
    Ne jako módní téma, ale jako kontrolovatelnou součást konkrétního nástroje.
  - >-
    Dnes pomáhám firmám, živnostníkům, obcím i neziskovým organizacím zbavit se
    stojatých vod, automatizovat rutinu a rozumně nasadit AI tam, kde skutečně
    pomáhá. Nechodím „s kanónem na vrabce“, ale vytěžím maximum z co
    nejjednodušších a nejlevnějších AI modelů.
