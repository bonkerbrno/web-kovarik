subtitle: >-
  Optimalizace procesů, architektura automatizací, smysluplné a bezpečné
  využití AI.
locationText: 📍 Česká republika  ·  ✉ info@kovarik.us
storyTitle: Proč to děláme
storyMoreLabel: Celý příběh
storyParagraphs:
  - >-
    Stanislav Kovařík je absolvent VUT v Brně, architekt a optimalizátor
    procesů. Přes 15 let pracoval v manažerských rolích od provozních po top
    management. Od roku 2015 se věnuje optimalizaci procesů a automatizaci, od
    roku 2023 také bezpečné a smysluplné implementaci AI.
  - >-
    Stále vidíme totéž: chytří a tvořiví lidé tráví hodiny prací, která je
    nudí a vyčerpává, a přitom se dá automatizovat. Dlouhodobě to vede k
    vyhoření.
  - >-
    Fascinuje nás, jak organizace fungují, co je zpomaluje a proč se výsledky
    ztrácejí v chaosu každodenního provozu. Kolegové za Stanislavem chodili s
    otázkou „Jak tohle zefektivnit?“ a z toho vyrostla specializace, kde
    vidíme největší dopad: zlepšování postupů, automatizace a rozumné nasazení
    AI jako kontrolovatelné součásti konkrétního nástroje.
  - >-
    Dnes pomáháme firmám, živnostníkům, obcím i neziskovým organizacím zbavit
    se stojatých vod, zautomatizovat rutinu a nasadit AI tam, kde skutečně
    pomáhá. Nechodíme s kanónem na vrabce: maximum vytěžíme z co
    nejjednodušších a nejlevnějších modelů.
experienceTitle: Zkušenosti a dovednosti
