storyTitle: "Proč dělám to, co dělám"
storyParagraphs:
  - >-
    Přes 15 let jsem pracoval v manažerských rolích — od středního
    managementu po ředitelské pozice v různých odvětvích. A v každé firmě
    jsem narážel na stejný problém: chytří lidé trávili hodiny na práci,
    která je nudila, vyčerpávala a přitom se dala automatizovat.
  - >-
    Fascinovalo mě, jak firmy fungují, co je zpomaluje a proč se přidaná
    hodnota ztrácí v procesním chaosu. Postupně jsem se stal tím, za kým
    kolegové chodili s otázkou „Jak toto zefektivnit?"
  - >-
    Před několika lety jsem se začal soustředit na oblast, kde vidím
    největší dopad: kombinaci procesní optimalizace, n8n automatizace a
    praktického nasazení AI. Ne jako módní téma, ale jako konkrétní
    nástroje, které jsem sám nastavoval, testoval a laděl.
  - >-
    Dnes pomáhám firmám — od malých rodinných podniků po střední firmy —
    zbavit se stojatých vod, automatizovat rutinu a rozumně nasadit AI
    tam, kde skutečně pomáhá.

