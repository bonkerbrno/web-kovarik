subtitle: Praktik ve firemních procesech, automatizaci a integrátor AI
locationText: 📍 Česká republika  ·  ✉ info@kovarik.us
storyTitle: Proč dělám to, co dělám
storyParagraphs:
  - >-
    Přes 15 let jsem pracoval v manažerských rolích — od středního managementu
    po ředitelské pozice. A v každé firmě jsem narážel na stejný problém: chytří
    lidé trávili hodiny na práci, která je nudila, vyčerpávala a přitom se dala
    automatizovat. 
  - >-
    Fascinovalo mě, jak firmy fungují, co je zpomaluje a proč se přidaná hodnota
    ztrácí v procesním chaosu. Postupně jsem se stal tím, za kým kolegové
    chodili s otázkou „Jak toto zefektivnit?"
  - >-
    Před několika lety jsem se začal soustředit na oblast, kde vidím největší
    dopad: kombinaci procesní optimalizace, automatizace a rozumného nasazení
    AI. Ne jako módní téma, ale jako kontrolovatelnou součást konkrétního
    nástroje.
  - >-
    Dnes pomáhám firmám — od malých rodinných podniků po střední firmy — zbavit
    se stojatých vod, automatizovat rutinu a rozumně nasadit AI tam, kde
    skutečně pomáhá.  Nechodím "s kanonem na vrabce" ale efektivně vytěžuji
    maximum z co nejjednodužších a nejlevnějších AI modelů.
