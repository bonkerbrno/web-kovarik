heroEyebrow: 'procesní optimalizace - automatizace - smysluplná implementace Ai '
heroTitleLine1: Méně stresů, méně chyb
heroTitleLine2: více času na tvorbu, vylepšování i soukromý život.
heroText: >-
  Pomůžu vám najít, kde zbytečně ztrácíte čas, zbavit se ruční nudné práce,
  kterou lépe zvládne počítač.  Lze rozumně a bezpečně využít AI?  Ano lze. Bez
  velkých investic a bez vlastního IT oddělení,  méně než byste čekali a vždy
  lze vědět co a kde dělá. Není cesta tvořit autonomní systémy nad jejichž
  činností nemáme kontrolu.
heroCtaPrimary: 'Konzultace '
heroCtaSecondary: Co nabízím →
problemsTitle: Poznáváte se?
problemsSubtitle: Tyhle situace jsou signálem, že je čas jednat.
problems:
  - icon: ⏱
    title: Místo plánování a vylepšování jen hasíte provoz
    desc: >-
      Každý den řešíte něco jiného a na to důležité nezbývá čas. Bez vás se nic
      nepohne. Kvalita života a zdraví se zhoršuje
  - icon: 🚧
    title: „Vždycky se to tak dělalo“
    desc: >-
      Nikdo už neví proč, ale dělá se to tak. Postupy má každý jen v hlavě a
      nikde nejsou sepsané.
  - icon: 🤖
    title: AI zatím jen z doslechu
    desc: >-
      O AI slyšíte všude, ale nemáte čas zjistit, k čemu by vám reálně pomohla.
      Většina komentářů řeší jen senzace. AI však lze využít jednoduše,
      bezpečně, levně a jen jako jeden z prvků automatizace činnosti. AI není
      jen chat, agent, asistent. AI je jen jedno kolečko celého soukolí, které
      funguje opakovaně , automaticky , vždy stejně a přesně.
  - icon: 🔁
    title: Pořád dokola ruční práce
    desc: >-
      Přepisování údajů, pořád stejné e-maily, ruční tabulky a výkazy. Každý
      týden znovu. A nejen to.  Automatizace rutin vylučuje chyby.
  - icon: 📊
    title: Informace roztroušené všude
    desc: >-
      Excel tu, e-maily tam, papíry v šanonu. Najít jednu informaci zabere půl
      dne. A hlavně i informace, které si členové týmu drží jen ve své hlavě. To
      je příčina stresu a chyb.  
  - icon: 💸
    title: Práce přibývá, čas ne
    desc: >-
      Věda nám přináší spoustu nástrojů. Reálná kvalita života (wellbeing) .
      Přibývá víc zakázek, žádostí i papírování, ale lidí ani hodin nepřibývá
      protože nejsou. A proto je tlak na výkon a stres.
servicesTitle: O čem se budeme bavit ?
services:
  - icon: 🔍
    title: Procesní audit
    desc: >-
      Projdu s vámi, jak pracujete, najdu místa, kde ztrácíte čas, a navrhnu
      konkrétní kroky.
    href: /sluzby#audit
  - icon: ⚙️
    title: Automatizace
    desc: >-
      Nastavím, aby rutinu jako faktury, objednávky nebo e-maily dělal počítač
      sám a bez chyb.
    href: /sluzby#n8n
  - icon: 🧠
    title: AI Implementace
    desc: >-
      Ukážu, kde vám AI opravdu pomůže, a nastavím ji tak, aby se na ni dalo
      spolehnout.
    href: /sluzby#ai
aboutEyebrow: Kdo za tím stojí
aboutName: Stan Kovařík
aboutText: >-
  Přes 15 let jsem pracoval v manažerských rolích v různých odvětvích. Z praxe
  vím, jak se zvyšuje míra stresu, množství zpracovávaných informací. Vím co
  chaos v každodenním provozu i jak z něj systematicky ven. Automatizace a AI
  pro mě nejsou módní slova, ale nástroje, nástroje k osvobození se, nástroje
  které nejsou složité, nástroje s principy které jsem vystudoval a v jejichž
  nasazení osobně věřím. J.F.Y.
aboutLinkText: Přečíst celý příběh →
ctaTitle: Just Free Yourself ...
ctaText: >-
  První konzultace je zdarma a bez závazků. Zjistíme spolu, kde má největší
  smysl začít.
