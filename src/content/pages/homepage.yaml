heroEyebrow: 'procesní optimalizace - automatizace - smysluplná implementace Ai '
heroTitleLine1: Ať to u vás zase plyne
heroTitleLine2: a na to důležité vám zbude čas
heroText: >-
  Pomůžu vám najít, kde zbytečně ztrácíte čas, zbavit se ruční práce, kterou
  zvládne počítač, a rozumně využít AI. Bez velkých investic a bez vlastního IT
  oddělení.
heroCtaPrimary: 'Konzultace '
heroCtaSecondary: Co nabízím →
problemsTitle: Poznáváte se?
problemsSubtitle: Tyhle situace jsou signálem, že je čas jednat.
problems:
  - icon: ⏱
    title: Místo plánování hasíte provoz
    desc: >-
      Každý den řešíte něco jiného a na to důležité nezbývá čas. Bez vás se nic
      nepohne.
  - icon: 🚧
    title: „Vždycky se to tak dělalo“
    desc: >-
      Nikdo už neví proč, ale dělá se to tak. Postupy má každý jen v hlavě a
      nikde nejsou sepsané.
  - icon: 🤖
    title: AI zatím jen z doslechu
    desc: O AI slyšíte všude, ale nemáte čas zjistit, k čemu by vám reálně pomohla.
  - icon: 🔁
    title: Pořád dokola ruční práce
    desc: >-
      Přepisování údajů, pořád stejné e-maily, ruční tabulky a výkazy. Každý
      týden znovu.
  - icon: 📊
    title: Informace roztroušené všude
    desc: >-
      Excel tu, e-maily tam, papíry v šanonu. Najít jednu informaci zabere půl
      dne.
  - icon: 💸
    title: Práce přibývá, čas ne
    desc: Víc zakázek, žádostí i papírování, ale lidí ani hodin nepřibývá.
servicesTitle: Jak konkrétně pomáhám
services:
  - icon: 🔍
    title: Procesní audit
    desc: >-
      Projdu s vámi, jak pracujete, najdu místa, kde ztrácíte čas, a navrhnu
      konkrétní kroky.
    href: /sluzby#audit
  - icon: ⚙️
    title: Automatizace
    desc: >-
      Nastavím, aby rutinu jako faktury, objednávky nebo e-maily dělal počítač
      sám a bez chyb.
    href: /sluzby#n8n
  - icon: 🧠
    title: AI Implementace
    desc: >-
      Ukážu, kde vám AI opravdu pomůže, a nastavím ji tak, aby se na ni dalo
      spolehnout.
    href: /sluzby#ai
aboutEyebrow: Kdo za tím stojí
aboutName: Stan Kovařík
aboutText: >-
  Přes 15 let v manažerských rolích v různých odvětvích. Z praxe vím, jak vypadá
  chaos v každodenním provozu i jak z něj systematicky ven. Automatizace a AI
  pro mě nejsou módní slova, ale nástroje, které sám denně používám a nastavuji
  klientům.
aboutLinkText: Přečíst celý příběh →
ctaTitle: Pojďme to u vás rozproudit
ctaText: >-
  První konzultace je zdarma a bez závazků. Zjistíme spolu, kde má největší
  smysl začít.
ctaButton: Domluvit konzultaci →
