  - icon: settings-automation
    title: Automatizace
    desc: Faktury, objednávky a e-maily budou dělat počítače sami a bez chyb.
    href: /sluzby#automatizace
  - icon: brain
    title: AI implementace
    desc: Nasadíme ji tam, kde pomůže a kde se na ni dá spolehnout. Na levných modelech.
    href: /sluzby#ai
aboutEyebrow: Kdo za tím stojí
aboutName: Ing. Stanislav Kovařík a tým
aboutText: >-
  Za týmem stojí Stanislav Kovařík, který přes 15 let řídil provoz v různých
  odvětvích. Víme, jak chaos vypadá zevnitř a jak z něj systematicky ven.
  Automatizace pro nás není módní slovo, ale nástroj k osvobození.
aboutLinkText: Přečíst celý příběh
ctaTitle: Be agile. Just free yourself ...
ctaText: Buďte připraveni a osvoboďte se. Společně zjistíme, kde má největší smysl začít.
ctaButton: Chceme konzultaci
