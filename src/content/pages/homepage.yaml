heroEyebrow: Procesy · Automatizace · AI · Bezpečnost
heroTitleLine1: Méně stresu a chyb,
heroTitleLine2: více času na důležité věci.
heroText: >-
  Najdeme, kde ztrácíte čas, a ruční práci předáme počítači. Pracujeme bez
  velkých investic, bez vlastního IT a s AI, která dělá jen to, co jí zadáme.
heroCtaPrimary: Konzultace zdarma →
heroCtaSecondary: Co nabízíme
heroCtaNote: První hovor trvá 30 minut, je online a nezávazný. Ozveme se do 24 hodin.
heroChips:
  - Bez vlastního IT
  - Levné modely, i lokálně
  - Vždy víte, co se děje
