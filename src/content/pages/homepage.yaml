problemsTitle: Poznáváte se?
problemsSubtitle: Situace, které slyšíme nejčastěji.
problemsMoreLabel: Další situace
problems:
  - icon: flame
    title: Hasíte místo plánování
    desc: Každý den řešíte něco jiného a na důležité nezbývá čas. Bez vás se nic nepohne, chyby i stres rostou.
  - icon: repeat
    title: Ruční práce pořád dokola
    desc: Přepisování údajů, stejné e-maily, ruční tabulky. Rutina, kterou lze automatizovat a vyloučit tak chyby.
  - icon: history
    title: „Vždycky se to tak dělalo“
    desc: Postupy jsou jen v hlavách lidí. Nikdo je nesepsal, nevyladil ani nezvážil automatizaci.
  - icon: robot
    title: Automatizace jen z doslechu
    desc: O AI se mluví všude, ale nevíte, co by vám reálně pomohlo. Dobře postavená automatizace nehalucinuje a běží i na levných modelech.
  - icon: files
    title: Informace roztroušené všude
    desc: Excel, e-maily, papíry v šanonu. Hledání jedné informace zabere půl dne a část je jen v hlavách lidí.
  - icon: hourglass
    title: Práce přibývá, čas ne
    desc: Zakázek i papírování přibývá, lidí a hodin ne. Roste tlak na výkon a s ním stres.
servicesTitle: S čím vám pomůžeme
services:
  - icon: zoom-check
    title: Procesní audit
    desc: Projdeme, kde ztrácíte čas, a navrhneme konkrétní kroky. Víte, co se vyplatí, ještě než cokoli zaplatíte za vývoj.
    href: /sluzby#audit
    linkText: Jak probíhá audit →
  - icon: settings-automation
    title: Automatizace
    desc: Faktury, objednávky a e-maily zpracuje počítač sám. Každý krok je vidět a člověk schvaluje to, na čem záleží.
    href: /sluzby#automatizace
    linkText: Co lze automatizovat →
  - icon: brain
    title: AI implementace
    desc: Nasadíme ji jen tam, kde pomůže a dá se ověřit. Většinou stačí malé a levné modely, i na vlastním počítači.
    href: /sluzby#ai
    linkText: Kde AI dává smysl →
stepsTitle: Jak to probíhá
steps:
  - title: Krátký hovor zdarma
    desc: Za 30 minut zjistíme, kde vás rutina nejvíc brzdí, a řekneme na rovinu, jestli vám umíme pomoci.
  - title: Návrh s jasnou cenou
    desc: Popíšeme konkrétní kroky, co přinesou a kolik budou stát. Rozhodujete vy, bez tlaku.
  - title: Spuštění pod kontrolou
    desc: Automatizaci postavíme, společně vyzkoušíme a předáme i s návodem. Vždy víte, co dělá a proč.
aboutEyebrow: Kdo za tím stojí
aboutName: Ing. Stanislav Kovařík a tým
aboutText: >-
  Za týmem stojí Stanislav Kovařík, který přes 15 let řídil provoz v různých
  odvětvích. Víme, jak chaos vypadá zevnitř a jak z něj systematicky ven.
  Automatizace pro nás není módní slovo, ale nástroj k osvobození.
aboutLinkText: Přečíst celý příběh
ctaTitle: Be agile. Just free yourself ...
ctaText: Osvoboďte se od rutiny. Za 30 minut společně najdeme místo, kde vám automatizace ušetří nejvíc času.
ctaButton: Domluvit hovor zdarma
