heroText: >-
  Najdeme, kde ztrácíte čas, a ruční práci předáme počítači. Pracujeme bez
  velkých investic, bez vlastního IT a s AI, která dělá jen to, co jí zadáme.
heroCtaPrimary: Konzultace zdarma →
heroCtaSecondary: Co nabízíme
